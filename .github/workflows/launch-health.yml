name: Launch health

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy Vibe Quest"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app-v8.js
          node --check flyer-studio.js
          node --check vibetinerary-studio.js
          node --check vibe-code-studio.js

      - name: Check launch files
        run: |
          test -s index.html
          test -s policies.html
          test -s policies.css
          test -s LAUNCH_READINESS.md
          test -s LAUNCH_RUNBOOK.md
          test -s SUPABASE_SETUP.md
          test -s robots.txt
          test -s sitemap.xml
          test -s assets/brand/vibe-quest-sept23.svg

      - name: Check local page assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const references = [...html.matchAll(/(?:src|href)=["'](\.\/[^"']+)["']/g)]
            .map((match) => match[1].replace(/^\.\//, '').split(/[?#]/)[0]);
          const missing = [...new Set(references)].filter((file) => !fs.existsSync(file));
          if (missing.length) {
            console.error(`Missing local page assets:\n${missing.join('\n')}`);
            process.exit(1);
          }
          console.log(`Verified ${new Set(references).size} local page assets.`);
          NODE

  production-smoke:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check public pages
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 https://www.vibe-quest.net/ | grep -q "Choose your vibe"
          curl --fail --silent --show-error --retry 3 --max-time 20 https://www.vibe-quest.net/policies.html | grep -q "Community rules"
          curl --fail --silent --show-error --retry 3 --max-time 20 https://www.vibe-quest.net/app-v8.js > /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 https://www.vibe-quest.net/styles.css > /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 https://www.vibe-quest.net/assets/out-there/field-note-001-martini.jpg > /dev/null

      - name: Check discovery backend
        env:
          VQ_SUPABASE_URL: https://wyebrsyiauxgoabzigrg.supabase.co
          VQ_PUBLISHABLE_KEY: sb_publishable_6I5XU6xWNs66UnBsEjRViQ_muAuooWJ
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            "$VQ_SUPABASE_URL/rest/v1/activities?select=id&status=eq.published&limit=1" \
            -H "apikey: $VQ_PUBLISHABLE_KEY" > /dev/null

          private_status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 \
            "$VQ_SUPABASE_URL/rest/v1/activity_private_locations?select=activity_id&limit=1" \
            -H "apikey: $VQ_PUBLISHABLE_KEY")
          test "$private_status" = "401"

          curl --fail --silent --show-error --retry 2 --max-time 20 \
            "$VQ_SUPABASE_URL/functions/v1/geocode" \
            -H "apikey: $VQ_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            --data '{"action":"search","query":"Austin, TX"}' > /dev/null
